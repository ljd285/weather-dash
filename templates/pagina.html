<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<script>
(function() {
    try {
        var guardado = localStorage.getItem('tema-aemet');
        var prefiereOscuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', guardado || (prefiereOscuro ? 'dark' : 'light'));
    } catch (e) {}
})();
</script>
<title>MeteoMaclet</title>
<meta name="description" content="El tiempo en Valencia: lo que marca ahora, lo que viene y cómo va el año. Datos de AEMET y Puertos del Estado.">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2F5D3A" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E1E1E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MeteoMaclet">
<script src="${plotly_js_url}"></script>
<script>if (window.Plotly) { ${locale_es_js} }</script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
${estilos}</style>
</head>
<body>
<div class="contenedor">
<header class="cabecera">
<div class="marca">
<div class="logo-marca"><svg viewBox="0 0 120 120" aria-hidden="true"><path d="M62 24 C68 10 84 8 92 12 C86 24 72 28 62 24 Z" fill="#2F5D3A"/><circle cx="60" cy="62" r="38" fill="#E8711A"/><rect x="18" y="70" width="84" height="5" fill="#F7F1E6"/><rect x="18" y="82" width="84" height="6" fill="#F7F1E6"/><rect x="18" y="94" width="84" height="7" fill="#F7F1E6"/><path d="M14 110 Q37 102 60 110 T106 110" fill="none" stroke="#2F5D3A" stroke-width="5" stroke-linecap="round"/></svg><h1>Meteo<span>Maclet</span></h1></div>
<p class="lema">El temps de Benimaclet · <span class="actualizado" data-generado="${generado_iso}">actualizado el ${generado_corto}</span></p>
</div>
<div class="controles-cabecera">
${selector}
<button id="toggle-tema" class="boton-tema" aria-label="Cambiar de tema">🌙</button>
</div>
</header>
<nav class="barra-secciones" aria-label="Secciones">
<div class="pestanas">
<a href="#${primera}-ahora" data-seccion="ahora" class="pestana pestana-ahora">Ahora</a>
<a href="#${primera}-pronostico" data-seccion="pronostico" class="pestana pestana-pronostico">Próximos días</a>
<a href="#${primera}-historico" data-seccion="historico" class="pestana pestana-historico">Histórico</a>
</div>
</nav>
<main>
${estaciones}
${mapa}
</main>
<footer>Actualizado el ${generado}. Datos: AEMET OpenData, Puertos del Estado y Copernicus (Open-Meteo).</footer>
</div>
<script>
${app_js}</script>
</body>
</html>
