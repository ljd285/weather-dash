name: Pruebas

# Comprueba el código en cada cambio (no toca AEMET: las pruebas usan datos
# de ejemplo). El workflow que publica el dashboard es update_dashboard.yml.
# En las ramas de trabajo ya se ejecutan por el pull request; en main, al
# fusionar. Así no se ejecutan dos veces por cada cambio.
on:
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  pull_request: {}

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Revisar el código (ruff)
        run: ruff check .

      - name: Ejecutar las pruebas
        run: pytest -q
