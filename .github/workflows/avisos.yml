name: Notificar avisos AEMET

# Cada 15 minutos consulta los avisos de AEMET de las zonas de config.py y
# abre, comenta o cierra issues con la etiqueta "aviso-aemet". Cada issue
# menciona a AVISOS_NOTIFICAR_A (config.py), y GitHub le envía un correo.
on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch: {}   # para lanzarlo a mano desde la pestaña Actions

permissions:
  contents: read
  issues: write
  actions: write   # para lanzar la actualización del dashboard si cambian los avisos

concurrency:
  group: notificar-avisos
  cancel-in-progress: false

jobs:
  avisos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar avisos y notificar
        id: notificar
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python avisos_notificar.py

      # Si ha aparecido, cambiado o terminado algún aviso, el dashboard se
      # actualiza ya en vez de esperar a su ejecución de cada hora.
      - name: Actualizar el dashboard si cambian los avisos
        if: steps.notificar.outputs.actualizar_dashboard == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run update_dashboard.yml --ref "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}"
