name: Inspección 112CV (prueba)

# Workflow de usar y tirar: descarga la página de alertas del 112CV y muestra
# en el log cómo está hecha (estado, cabeceras, HTML y posibles endpoints de
# datos), para decidir cómo leerla. Solo vive en una rama de pruebas y se
# ejecuta al hacer push a ella o a mano.
on:
  push:
    branches: [avisosVLC-inspeccion-112cv]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  inspeccion:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      URL: https://www.112cv.gva.es/es/alertas-metereologicos
    steps:
      - name: Descargar el widget de avisos (JavaScript)
        env:
          JS: https://wpr.112cv.gva.es/external/api/storage/descargar/js/static/dist/vanilla/liferay/avisos-meteo.js
        run: |
          mkdir -p salida
          curl -sS -L -m 60 -A "weather-dash-inspeccion (+https://github.com/ljd285/weather-dash)" \
            -D salida/js_cabeceras.txt -o salida/avisos-meteo.js -w "estado=%{http_code} tipo=%{content_type} bytes=%{size_download}\n" "$JS" || echo "curl falló: $?"
          echo "===== CABECERAS ====="
          cat salida/js_cabeceras.txt || true

      - name: Endpoints y cadenas que parecen datos
        run: |
          F=salida/avisos-meteo.js
          echo "===== URLS completas (http/https) ====="
          grep -oE "https?://[A-Za-z0-9_./:?=&%@+~#-]+" $F | sort -u | head -80 || true
          echo "===== RUTAS que contienen api, json, aviso, alert, meteo, zona, comarca, geo ====="
          grep -oE "[\"'\`](/[A-Za-z0-9_./{}:?=&%-]*)[\"'\`]" $F | grep -iE "api|json|aviso|alert|meteo|zona|comarca|geo|wms|storage" | sort -u | head -80 || true
          echo "===== fetch( / XMLHttpRequest / axios / .get( con contexto ====="
          grep -oE ".{0,120}(fetch\(|XMLHttpRequest|axios|\.open\(\"GET\").{0,200}" $F | head -30 || true
          echo "===== palabras clave de datos con contexto ====="
          grep -oE ".{0,100}(preemergencia|emergencia|nivel|fenomeno|fenómeno|comarca|geojson|\.json).{0,140}" $F | head -40 || true

      - uses: actions/upload-artifact@v4
        with:
          name: js-112cv
          path: salida/
