name: Inspección 112CV (prueba)

# Workflow de usar y tirar: descarga la página de alertas del 112CV y muestra
# en el log cómo está hecha (estado, cabeceras, HTML y posibles endpoints de
# datos), para decidir cómo leerla. Solo vive en una rama de pruebas y se
# ejecuta al hacer push a ella o a mano.
on:
  push:
    branches: [avisosVLC-inspeccion-112cv]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  inspeccion:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      URL: https://www.112cv.gva.es/es/alertas-metereologicos
    steps:
      - name: Descargar el widget de avisos (JavaScript)
        env:
          JS: https://wpr.112cv.gva.es/external/api/storage/descargar/js/static/dist/vanilla/liferay/avisos-meteo.js
        run: |
          mkdir -p salida
          curl -sS -L -m 60 -A "weather-dash-inspeccion (+https://github.com/ljd285/weather-dash)" \
            -D salida/js_cabeceras.txt -o salida/avisos-meteo.js -w "estado=%{http_code} tipo=%{content_type} bytes=%{size_download}\n" "$JS" || echo "curl falló: $?"
          echo "===== CABECERAS ====="
          cat salida/js_cabeceras.txt || true

      - name: Descargar los JSON de datos
        run: |
          UA="weather-dash-inspeccion (+https://github.com/ljd285/weather-dash)"
          B=https://wpr.112cv.gva.es/external/api/storage/descargar/json
          for r in avisosmeteorologicos datos/fenomenos static/situacion static/zonas; do
            n=$(echo "$r" | tr '/' '_')
            /usr/bin/time -f "tiempo=%es" curl -sS -L -m 120 -A "$UA" -D "salida/$n.cab" -o "salida/$n.json" \
              -w "$r -> estado=%{http_code} tipo=%{content_type} bytes=%{size_download}\n" "$B/$r" || echo "falló $r"
          done
          ls -la salida/

      - name: Contenido de los JSON
        run: |
          for n in avisosmeteorologicos datos_fenomenos static_situacion; do
            echo "################ $n.json"
            head -c 6000 "salida/$n.json" || true
            echo
          done
          echo "################ static_zonas.json (primeros 2500 bytes y filas de València)"
          head -c 2500 salida/static_zonas.json || true
          echo
          grep -oiE ".{0,200}(valencia|val[eè]ncia|litoral norte).{0,200}" salida/static_zonas.json | head -8 || true

      - name: Cómo interpreta el widget los datos (contexto en el HTML)
        run: |
          H=$(ls salida/*avisos-meteo.html 2>/dev/null || true)
          if [ -z "$H" ]; then curl -sS -L -m 120 -A "weather-dash-inspeccion" -o salida/avisos-meteo.html https://wpr.112cv.gva.es/external/api/storage/descargar/html/static/dist/vanilla/avisos-meteo.html; H=salida/avisos-meteo.html; fi
          for k in "avisosmeteorologicos" "json/datos/fenomenos" "json/static/situacion" "json/static/zonas" "url(path)" "ID_ZONA\|ID_FENOMENO\|ID_SITUACION\|NIVEL\|FECHA"; do
            echo "################ contexto de: $k"
            grep -n -B6 -A14 "$k" "$H" | cut -c1-220 | head -60
          done

      - uses: actions/upload-artifact@v4
        with:
          name: js-112cv
          path: salida/
