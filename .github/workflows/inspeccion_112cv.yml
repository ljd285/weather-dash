name: Inspección 112CV (prueba)

# Workflow de usar y tirar: descarga la página de alertas del 112CV y muestra
# en el log cómo está hecha (estado, cabeceras, HTML y posibles endpoints de
# datos), para decidir cómo leerla. Solo vive en una rama de pruebas y se
# ejecuta al hacer push a ella o a mano.
on:
  push:
    branches: [avisosVLC-inspeccion-112cv]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  inspeccion:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      URL: https://www.112cv.gva.es/es/alertas-metereologicos
    steps:
      - name: Descargar el widget de avisos (JavaScript)
        env:
          JS: https://wpr.112cv.gva.es/external/api/storage/descargar/js/static/dist/vanilla/liferay/avisos-meteo.js
        run: |
          mkdir -p salida
          curl -sS -L -m 60 -A "weather-dash-inspeccion (+https://github.com/ljd285/weather-dash)" \
            -D salida/js_cabeceras.txt -o salida/avisos-meteo.js -w "estado=%{http_code} tipo=%{content_type} bytes=%{size_download}\n" "$JS" || echo "curl falló: $?"
          echo "===== CABECERAS ====="
          cat salida/js_cabeceras.txt || true

      - name: Descargar liferay-loader.js y avisos-meteo.html
        run: |
          UA="weather-dash-inspeccion (+https://github.com/ljd285/weather-dash)"
          B=https://wpr.112cv.gva.es/external/api/storage/descargar
          for u in "$B/js/static/dist/vanilla/liferay/liferay-loader.js" "$B/html/static/dist/vanilla/avisos-meteo.html" "$B/js/static/dist/vanilla/liferay-loader.js"; do
            n=$(echo "$u" | sed 's#.*/##; s#[^A-Za-z0-9._-]#_#g')
            curl -sS -L -m 60 -A "$UA" -o "salida/$(echo $u | md5sum | cut -c1-6)_$n" -w "$u -> estado=%{http_code} tipo=%{content_type} bytes=%{size_download}\n" "$u" || echo "falló $u"
          done
          ls -la salida/

      - name: Buscar de dónde salen los datos
        run: |
          for F in salida/*liferay-loader.js salida/*avisos-meteo.html; do
            [ -s "$F" ] || continue
            echo "################ $F ($(wc -c < "$F") bytes)"
            echo "--- URLs http(s) ---"
            grep -oE "https?://[A-Za-z0-9_./:?=&%@+~#{}$-]+" "$F" | sort -u | head -60 || true
            echo "--- rutas /... con api|json|aviso|alert|meteo|zona|comarca|geo|wms|storage|mapas ---"
            grep -oE "[\"'\`](/[A-Za-z0-9_./{}:?=&%$-]*)[\"'\`]" "$F" | grep -iE "api|json|aviso|alert|meteo|zona|comarca|geo|wms|storage|mapas" | sort -u | head -60 || true
            echo "--- fetch/XHR/axios con contexto ---"
            grep -oE ".{0,100}(fetch\(|XMLHttpRequest|axios|\.get\(|\.open\(.GET).{0,160}" "$F" | head -20 || true
            echo "--- ficheros .js/.css/.json/.html referenciados ---"
            grep -oE "[A-Za-z0-9_./:-]+\.(js|mjs|css|json|geojson|html)" "$F" | sort -u | head -40 || true
          done

      - uses: actions/upload-artifact@v4
        with:
          name: js-112cv
          path: salida/
