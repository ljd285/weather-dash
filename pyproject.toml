# Configuración de ruff (el revisor de código que ejecuta el workflow de
# pruebas). Las reglas se fijan aquí para que no cambien con cada versión
# de ruff: errores reales (E/F), fallos habituales (B), orden de los
# imports (I) y el uso de datetime.utcnow(), obsoleto (DTZ003).
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "DTZ003"]
